function impSug(t){const tx=(t.descricao+' '+(t.comercio||'')).toLowerCase(),card=t.conta_tipo==='CREDIT',sai=t.movimento==='saida';
 if(card)return sai?{tp:'c'}:{tp:'ign',why:'pagamento ou estorno do cartão'};
 if(sai){if(/fatura/.test(tx))return {tp:'pf'};if(/caixinha|rdb|aplica/.test(tx))return {tp:'xg'};return {tp:'d'}}
 if(/caixinha|rdb|resgate/.test(tx))return {tp:'xr'};
 const nm=norm(cfg.nomeSalario||'').trim();if(nm&&norm(tx+' '+(t.pagador||'')).includes(nm))return {tp:'ign',why:'salário/adiantamento — já está no modelo mensal'};
 const ad=adOf(cfg),lq=cfg.base-ad-cfg.outros;if([lq,ad].some(v=>v>0&&Math.abs(v-t.valor)<1))return {tp:'ign',why:'parece ser o salário, que já está no modelo mensal'};

/* procura lançamento já existente com o mesmo valor em data próxima (ou fixo do mesmo mês) */
function impDup(t){const d0=new Date(t.data),perto=d=>d&&Math.abs(new Date(d)-d0)<=3*864e5,ig=v=>Math.abs(v-t.valor)<0.01;
 for(const kk in extras)for(const i of extras[kk])if(ig(i.valor)&&perto(i.data))return {nome:i.nome,data:i.data};
 for(const x of cx)if(x.tipo!=='i'&&ig(x.valor)&&perto(x.data))return {nome:x.nome||'Caixinha',data:x.data};
 const key=t.data.slice(0,7),sn=snaps[key]||{fixos:cfg.fixos};for(const f of sn.fixos||[])if(ig(f.valor))return {nome:f.nome,data:dateOf(key,f.dv)};return null}
const impDia=d=>+d.slice(8,10)>=20?'d20':'d5';

 LB={c:'Lançar como cartão',d:'Lançar como despesa',r:'Lançar como receita',xg:'Lançar como caixinha (guardar)',xr:'Lançar como caixinha (resgatar)',pf:'Registrar pagamento da fatura'},fk=pf?impFatKey(t.data):'',

function saveItem(){const n=$('i_n').value.trim(),v=pn($('i_v')),dt=$('i_dt').value;if(!n||!v){toast('Preencha nome e valor');return}if(!dt){toast('Informe a data');return}
 const TP=$('i_t').value,o={nome:n,valor:v,cartao:TP==='r'?false:$('i_c').checked,dia:$('i_d').value,tipo:TP==='r'?'r':undefined},it=ctx.it;
 if(ctx.fx){o.dv=Math.min(31,Math.max(1,+dt));if(ctx.id)Object.assign(it,o);else ctx.list.push({id:++uid,...o});if(ctx.mode==='mes')dirty.snaps.add(k)}

var SUPABASE_URL = 'https://bwxliwyxxpqcyitzoclf.supabase.co';             // ex.: https://abcdefghijkl.supabase.co
var SUPABASE_CHAVE_PUBLICA = 'sb_publishable_ngjgWHb_FcflANnHyDnlVw_SEI_lK5R'; // "anon public" ou "publishable"
let sbc=null;
const SB=()=>sbc||(sbc=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}}));
async function uid_(){const {data}=await SB().auth.getSession();if(!data.session)throw new Error('UNAUTHORIZED');return data.session.user.id}
function ok_(r){if(r.error){const m=String(r.error.message||r.error);if(r.status===401||r.error.code==='PGRST301'||/jwt/i.test(m))throw new Error('UNAUTHORIZED');throw new Error(m)}return r.data}
async function todos_(t,cols,ord,ativos){let out=[];for(let i=0;;i+=1000){let s=SB().from(t).select(cols);if(ativos)s=s.is('excluido_em',null);const d=ok_(await s.order(ord).range(i,i+999));out=out.concat(d);if(d.length<1000)return out}}
/* exclusão lógica: marca a data/hora em excluido_em em vez de apagar a linha */
const excluir_=(t,u)=>SB().from(t).update({excluido_em:new Date().toISOString()}).eq('user_id',u).is('excluido_em',null);
const API={
 async getAll(){await uid_();
  const [c,ms,ls,xs]=await Promise.all([SB().from('config').select('dados').maybeSingle().then(ok_),todos_('meses','mes,dados','mes'),todos_('lancamentos','*','id',1),todos_('caixinha','*','id',1)]);
  const snaps={},extras={};ms.forEach(r=>snaps[r.mes]=r.dados);
  ls.forEach(r=>{const it={id:+r.id,nome:r.nome,valor:+r.valor,cartao:!!r.cartao,dia:r.dia,data:r.data||''};if(r.tipo==='r')it.tipo='r';
   if(r.parcela&&r.total_parcelas){it.parc={p:r.parcela,n:r.total_parcelas};it.gid=r.grupo||''}(extras[r.mes]=extras[r.mes]||[]).push(it)});
  return {cfg:c?c.dados:null,snaps,extras,cx:xs.map(r=>({id:+r.id,data:r.data||'',tipo:r.tipo,valor:+r.valor,nome:r.nome||'',dia:r.dia||'d5'}))}},
 /* grava primeiro e só depois remove o que saiu — assim uma falha no meio não apaga dados */
 async salvar(p){const u=await uid_(),db=SB();
  if(p.cfg)ok_(await db.from('config').upsert({user_id:u,dados:p.cfg,atualizado_em:new Date().toISOString()}));
  if(p.snaps)ok_(await db.from('meses').upsert(Object.keys(p.snaps).map(m=>({user_id:u,mes:m,dados:p.snaps[m]})),{onConflict:'user_id,mes'}));
  if(p.ext){const ks=Object.keys(p.ext),rows=[];
   ks.forEach(m=>(p.ext[m]||[]).forEach(it=>rows.push({user_id:u,id:it.id,mes:m,nome:it.nome,valor:it.valor,cartao:!!it.cartao,dia:it.dia||'d5',data:it.data||null,
    parcela:it.parc?it.parc.p:null,total_parcelas:it.parc?it.parc.n:null,grupo:it.gid||null,tipo:it.tipo==='r'?'r':null,excluido_em:null})));
   if(rows.length)ok_(await db.from('lancamentos').upsert(rows,{onConflict:'user_id,id'}));
   let d=excluir_('lancamentos',u).in('mes',ks);if(rows.length)d=d.not('id','in','('+rows.map(r=>r.id).join(',')+')');ok_(await d)}
  if(p.cx){const rows=p.cx.map(x=>({user_id:u,id:x.id,data:x.data||null,tipo:x.tipo,valor:x.valor,nome:x.nome||'',dia:x.dia||'d5',excluido_em:null}));
   if(rows.length)ok_(await db.from('caixinha').upsert(rows,{onConflict:'user_id,id'}));
   let d=excluir_('caixinha',u);if(rows.length)d=d.not('id','in','('+rows.map(r=>r.id).join(',')+')');ok_(await d)}
  return true},
 /* zerar: lançamentos e caixinha ficam marcados como excluídos; modelo e cópias dos meses são apagados */
 async resetarTudo(){const u=await uid_();for(const t of ['lancamentos','caixinha'])ok_(await excluir_(t,u));for(const t of ['meses','config'])ok_(await SB().from(t).delete().eq('user_id',u));return true}
};
function post(fn,args){if(!API[fn])return Promise.reject(new Error('Função desconhecida: '+fn));let to;
 return Promise.race([API[fn](...args),new Promise((_,rej)=>{to=setTimeout(()=>rej(new Error('Tempo esgotado ao falar com o servidor. Verifique a conexão.')),25000)})]).finally(()=>clearTimeout(to))}
function runner(ok,fail){return new Proxy({},{get(_,p){
 if(p==='withSuccessHandler')return f=>runner(f,fail);
 if(p==='withFailureHandler')return f=>runner(ok,f);
 return(...a)=>{post(p,a).then(r=>{try{ok&&ok(r)}catch(err){fail&&fail(err)}},e=>fail&&fail(e))}}})}
window.google={script:{run:runner(null,null)}};

function flush(){const p={};if(dirty.cfg)p.cfg=cfg;if(dirty.cx)p.cx=cx;
 if(dirty.snaps.size){p.snaps={};dirty.snaps.forEach(x=>p.snaps[x]=snaps[x])}
 if(dirty.ext.size){p.ext={};dirty.ext.forEach(x=>p.ext[x]=extras[x]||[])}
 dirty.cfg=false;dirty.cx=false;dirty.snaps.clear();dirty.ext.clear();
 if(!Object.keys(p).length)return;
 q=q.then(()=>new Promise(res=>google.script.run.withSuccessHandler(()=>res()).withFailureHandler(e=>{res();
  if(String(e.message).includes('UNAUTHORIZED'))return login('Sessão expirada. Entre novamente.');toast('Erro ao salvar: '+e.message)}).salvar(p)))}

 $('app').innerHTML=`<div class="box" style="margin-top:18vh"><h4>Meu Controle Financeiro</h4><label for="lg_e">E-mail</label><input id="lg_e" type="email" autocomplete="username" onkeydown="if(event.key==='Enter')$('lg').focus()">

 google.script.run.withSuccessHandler(d=>{cfg=Object.assign(defCfg(),d.cfg||{});if(!cfg.pagReal){cfg.pagReal=today;dirty.cfg=true}snaps=d.snaps||{};extras=d.extras||{};cx=d.cx||[];k=openKey();mes(k);flush();render();hideSplash();impLoad().then(()=>{if($('app').querySelector('.kpis'))render()})})
 .withFailureHandler(e=>{if(String(e.message).includes('UNAUTHORIZED'))return login()
  hideSplash();$('app').innerHTML=`<div class="box" style="margin-top:18vh"><h4>Não foi possível carregar</h4><div class="hint">${e.message}</div><button class="pri" onclick="load()">Tentar de novo</button></div>`}).getAll()}

 if(typeof supabase==='undefined')return fatal('Não foi possível carregar o Supabase. Verifique a conexão e recarregue.');
