<script>

const cur=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')})();let k,flt='all',uid=Date.now(),draft=null,ctx=null,pg=0;

 const st=today>due?'paga':today>=close?'fechada':today>=prev?'aberta':'futura';return{st,close,prev,due}}

function pascoa(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),q=c%4,l=(32+2*e+2*i-h-q)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),dd=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,dd)}

<label class="chk" style="color:var(--tx);font-size:14px;margin:0 0 12px"><input id="c_ap" type="checkbox" ${(d._ap===undefined?startedMonths().some(emptyM):d._ap)?'checked':''}><span>Ao salvar, escolher meses já iniciados para refazer com este modelo</span></label>
<button class="pri" onclick="saveCfg()">Salvar</button><button class="dan" onclick="askReset()">Zerar o sistema…</button></div></div>`}
function sal(f){const b=pn($('s_base')),ad=b*pi($('s_pct'))/100;
 if(f==='liq'){$('s_out').value=fm(Math.max(0,b-ad-pn($('s_liq'))))}else{$('s_liq').value=fm(Math.max(0,b-ad-pn($('s_out'))))}
 $('s_ad').value=fm(ad);$('s_tot').textContent=R(ad+pn($('s_out')))}
function readCfg(){draft.base=pn($('s_base'));draft.pct=pi($('s_pct'));draft.outros=pn($('s_out'));draft._ap=$('c_ap').checked;
 draft.cartao={fech:pi($('c_f')),venc:pi($('c_v')),limite:pn($('c_l'))}}
function closeCfg(){$('m1').innerHTML='';draft=null}
function askReset(){$('m2').innerHTML=`<div class="ov top2" onclick="if(event.target===this)$('m2').innerHTML=''"><div class="sheet"><h3>Zerar o sistema <button class="ib" onclick="$('m2').innerHTML=''" aria-label="Fechar">✕</button></h3>
 <div class="hint" style="color:var(--bad);margin-bottom:8px"><b>Atenção!</b> Isso apaga o modelo mensal, a cópia de cada mês e todos os lançamentos. Não dá para desfazer.</div>
 <label>Digite ZERAR para confirmar</label><input id="rs" autocomplete="off" autocapitalize="characters"><button class="dan" onclick="doReset()">Zerar tudo</button></div></div>`}
function afterReset(){cfg=defCfg();Object.keys(snaps).forEach(x=>delete snaps[x]);Object.keys(extras).forEach(x=>delete extras[x]);cx=[];
 if(typeof dirty!=='undefined'){dirty.cfg=false;dirty.cx=false;dirty.snaps.clear();dirty.ext.clear()}
 $('m2').innerHTML='';closeCfg();k=openKey();mes(k);if(typeof flush==='function')flush();render();toast('Sistema zerado')}
function doReset(){if($('rs').value.trim().toUpperCase()!=='ZERAR'){toast('Digite ZERAR para confirmar');return}
 if(typeof google!=='undefined')google.script.run.withSuccessHandler(afterReset).withFailureHandler(e=>toast('Erro: '+e.message)).resetarTudo();else afterReset()}
function saveCfg(){readCfg();const ap=draft._ap;delete draft._ap;cfg=draft;dirty.cfg=true;closeCfg();flush();toast('Salvo — vale para os próximos meses a iniciar');render();if(ap)openApply()}
function emptyM(key){const sn=snaps[key];return !sn||(!sn.liq&&!sn.adiant&&!sn.fixos.length)}
function startedMonths(){const ok=openKey(),ck=addM(ok,-1);return inv(ck).st==='fechada'?[ck,ok]:[ok]}
function openApply(){const rows=startedMonths().map(key=>{const sn=snaps[key],empty=!sn||(!sn.liq&&!sn.adiant&&!sn.fixos.length);
 return `<label class="chk" style="color:var(--tx);font-size:14px"><input type="checkbox" class="ap" value="${key}" ${empty?'checked':''}>${lbl(key)} · fatura ${LBL[inv(key).st].toLowerCase()}${empty?' (sem configuração)':''}</label>`}).join('');
 $('m2').innerHTML=`<div class="ov top2" onclick="if(event.target===this)$('m2').innerHTML=''"><div class="sheet"><h3>Aplicar o modelo a meses já iniciados? <button class="ib" onclick="$('m2').innerHTML=''" aria-label="Fechar">✕</button></h3>
 <div class="hint">Por padrão, mudanças no modelo valem só para os meses que ainda vão começar. Marque abaixo os meses que devem ser refeitos com o modelo atual (salário e valores fixos). Lançamentos avulsos e parcelas não mudam.</div>
 <div class="box" style="margin-top:10px">${rows}</div><button class="pri" onclick="doApply()">Aplicar</button><button class="dan" style="border-color:var(--ln);color:var(--mut)" onclick="$('m2').innerHTML=''">Agora não</button></div></div>`}
function doApply(){const ks=[...document.querySelectorAll('.ap:checked')].map(x=>x.value);ks.forEach(key=>{snaps[key]=mkSnap();dirty.snaps.add(key)});flush();$('m2').innerHTML='';toast(ks.length?'Modelo aplicado em '+ks.map(lbl).join(' e '):'Nenhum mês alterado');render()}
/* ---- Item (fixo ou lançamento) ---- */
const lbl=key=>MN[+key.slice(5)-1]+'/'+key.slice(0,4);
const billKey=(d,card)=>{const key=d.slice(0,7);return card&&+d.slice(8,10)>=cfg.cartao.fech?addM(key,1):key};
const put=(key,it)=>{dirty.ext.add(key);(extras[key]||(extras[key]=[])).push(it)};
function locate(id){for(const kk in extras){const it=extras[kk].find(x=>x.id===id);if(it)return{key:kk,arr:extras[kk],it}}return null}
const getScope=()=>{const r=document.querySelector('input[name=sc]:checked');return r?r.value:'one'};
function openItem(mode,id,dia){let list,it,key=k;
 if(mode==='cfg'){readCfg();list=draft.fixos;it=list.find(x=>x.id===id)}
 else{const m=mes(k),L=id?locate(id):null;
  if(L){list=L.arr;it=L.it;key=L.key}else if(id&&!m.live){list=m.snap.fixos;it=list.find(x=>x.id===id)}
  if(id&&!it){toast('Fixo de mês futuro: edite em Modelo mensal');return}}
 const fx=mode==='cfg'||!!(it&&it.fixo);
 it=it||{id:0,nome:'',valor:'',cartao:false,dia:dia||'d5',data:today};ctx={mode,id,list,fx,it,key};
 const par=!fx&&!id,pc=it.parc?`<div class="box" style="margin:12px 0 10px"><h4>Despesa parcelada <span class="pc">${it.parc.p}/${it.parc.n}</span></h4>
 <div class="sum" style="border:0;margin:0;padding:0"><span>Compra</span><b>${it.parc.n}x de ${R(it.valor)}</b></div><div class="sum"><span>Total aproximado</span><b>${R(it.valor*it.parc.n)}</b></div><div class="sum"><span>Parcelas após esta</span><b>${it.parc.n-it.parc.p}</b></div>
 <div class="hint"><b>Atenção!</b> Esta é uma despesa repetida (${it.parc.p}/${it.parc.n}). Ao salvar ou excluir, aplicar a:</div>
 <label class="chk" style="color:var(--tx);font-size:14px"><input type="radio" name="sc" value="one" checked>Somente esta</label>
 <label class="chk" style="color:var(--tx);font-size:14px"><input type="radio" name="sc" value="fut">Esta e as futuras</label>
 <label class="chk" style="color:var(--tx);font-size:14px"><input type="radio" name="sc" value="all">Todas (incluindo efetivadas)</label></div>`:'';
 $('m2').innerHTML=`<div class="ov top2" onclick="if(event.target===this)$('m2').innerHTML=''"><div class="sheet"><h3>${id?'Editar':'Novo'} ${fx?'valor fixo':'lançamento'} <button class="ib" onclick="$('m2').innerHTML=''" aria-label="Fechar">✕</button></h3>
<div class="seg"><button id="t_d" onclick="setT('d')">− Despesa</button><button id="t_r" onclick="setT('r')">＋ Receita</button></div><input type="hidden" id="i_t" value="${it.tipo==='r'?'r':'d'}">
 <label>Nome</label><input id="i_n" value="${it.nome}" placeholder="Ex.: Condomínio">
 <div class="g2"><div><label>${par?'Valor total':it.parc?'Valor da parcela':'Valor'}</label><input id="i_v" ${MY} value="${it.valor===''?'':fm(it.valor)}" oninput="mk(this);upd()"></div>
 <div>${fx?`<label>Dia do vencimento</label><input id="i_dt" ${DG} value="${it.dv||''}" oninput="dg(this,2)">`:`<label>${it.parc?'Data desta parcela':'Data'}</label><input id="i_dt" type="date" value="${it.data}" onchange="upd()">`}</div></div>
 <div class="chk" id="w_c"><input id="i_c" type="checkbox" ${it.cartao?'checked':''} onchange="upd()"><span>É do cartão de crédito</span></div>
 ${par?`<div class="chk" id="w_p"><input id="i_p" type="checkbox" onchange="upd()"><span>Parcelado em</span><input id="i_pn" ${DG} value="2" style="width:80px" disabled oninput="dg(this,2);upd()"><span>x</span></div>`:''}
 <label id="l_d">Dia do mês</label><select id="i_d"><option value="d5">5º dia útil</option><option value="d20">Dia 20</option></select>
 <div class="hint" id="i_h"></div>${pc}<button class="pri" onclick="saveItem()">Salvar</button>${id?'<button class="dan" onclick="delItem()">Excluir</button>':''}</div></div>`;
 $('i_d').value=it.dia;setT($('i_t').value)}
function setT(t){$('i_t').value=t;const r=t==='r';$('t_d').classList.toggle('on',!r);$('t_r').classList.toggle('on',r);
 $('w_c').style.display=r?'none':'';const wp=$('w_p');if(wp){wp.style.display=r?'none':'';if(r)$('i_p').checked=false}
 if(r)$('i_c').checked=false;$('i_n').placeholder=r?'Ex.: Aluguel recebido':'Ex.: Condomínio';$('l_d').textContent=r?'Entra no':'Dia do mês';upd()}
function upd(){const c=$('i_c').checked;if(c)$('i_d').value='d5';$('i_d').disabled=c;let h=c?'Cartão sempre vai para o 5º dia útil. ':'';
 if(!ctx.fx){const dt=$('i_dt').value;if(dt)h+=($('i_t').value==='r'?'Cai em ':'Entra em ')+lbl(billKey(dt,c))+(c?' (fechamento dia '+cfg.cartao.fech+')':'')+'. '}
 const p=$('i_p');if(p){const n=+$('i_pn').value;$('i_pn').disabled=!p.checked;if(p.checked&&n>=2)h+=n+'x de '+R(pn($('i_v'))/n)+', nos meses seguintes.'}
 $('i_h').textContent=h}
function saveItem(){const n=$('i_n').value.trim(),v=pn($('i_v')),dt=$('i_dt').value;if(!n||!v){toast('Preencha nome e valor');return}if(!dt){toast('Informe a data');return}
 const TP=$('i_t').value,o={nome:n,valor:v,cartao:TP==='r'?false:$('i_c').checked,dia:$('i_d').value,tipo:TP==='r'?'r':undefined},it=ctx.it;
 if(ctx.fx){o.dv=Math.min(31,Math.max(1,+dt));if(ctx.id)Object.assign(it,o);else ctx.list.push({id:++uid,...o});if(ctx.mode==='mes')dirty.snaps.add(k)}
 else{o.data=dt;
  if(!ctx.id){const p=$('i_p'),N=p&&p.checked&&TP!=='r'?Math.max(2,Math.min(48,+$('i_pn').value||2)):1,base=billKey(dt,o.cartao);
   if(N===1)put(base,{id:++uid,...o});
   else{const c=Math.round(v*100),b=Math.floor(c/N),gid='g'+(++uid);
    for(let i=0;i<N;i++)put(addM(base,i),{id:++uid,...o,valor:(i?b:c-b*(N-1))/100,data:addMD(dt,i),parc:{p:i+1,n:N},gid})}
   toast('Lançado em '+lbl(base))}
  else{const sc=it.parc?getScope():'one',ap=it.parc?it.parc.p:0,ch=dt!==it.data||o.cartao!==it.cartao,bk=ch?billKey(dt,o.cartao):ctx.key;
   let T=[{key:ctx.key,it}];
   if(it.parc&&sc!=='one'){T=[];for(const kk in extras)extras[kk].forEach(x=>{if(x.gid===it.gid&&(sc==='all'||x.parc.p>=ap))T.push({key:kk,it:x})})}
   T.forEach(t=>{const dp=t.it.parc?t.it.parc.p-ap:0;dirty.ext.add(t.key);extras[t.key]=extras[t.key].filter(x=>x!==t.it);
    Object.assign(t.it,o,{data:addMD(dt,dp)});put(addM(bk,dp),t.it)});
   if(bk!==ctx.key)toast('Movido para '+lbl(bk))}}
 $('m2').innerHTML='';flush();ctx.mode==='cfg'?drawCfg():render()}
function delItem(){const it=ctx.it;
 if(ctx.fx){ctx.list.splice(ctx.list.indexOf(it),1);if(ctx.mode==='mes')dirty.snaps.add(k)}
 else{const sc=it.parc?getScope():'one',gone=x=>x===it||(it.parc&&sc!=='one'&&x.gid===it.gid&&(sc==='all'||x.parc.p>=it.parc.p));
  for(const kk in extras){const b=extras[kk].length;extras[kk]=extras[kk].filter(x=>!gone(x));if(extras[kk].length!==b)dirty.ext.add(kk)}}
 $('m2').innerHTML='';flush();ctx.mode==='cfg'?drawCfg():render()}
/* ---- Ponte: simula google.script.run via fetch para o Apps Script ---- */
const API_URL='https://script.google.com/macros/s/AKfycbyO5xXoXN6CXmyURsiklkYr8BtWNiqqk1hfUyD_MkKn51BROAImja_0-CpH1M95f6xm/exec';
const CK='prumo_code';
const getCode=()=>{try{return localStorage.getItem(CK)||''}catch(e){return ''}};
function post(fn,args){const ac=new AbortController(),to=setTimeout(()=>ac.abort(),25000);
 return fetch(API_URL,{method:'POST',signal:ac.signal,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args,code:getCode()})})
 .then(r=>r.json()).then(r=>{if(!r.ok)throw new Error(r.error||'Erro desconhecido');return r.data})
 .catch(e=>{throw(e&&e.name==='AbortError')?new Error('Tempo esgotado ao falar com o servidor. Verifique a conexão.'):e}).finally(()=>clearTimeout(to))}
function runner(ok,fail){return new Proxy({},{get(_,p){
 if(p==='withSuccessHandler')return f=>runner(f,fail);
 if(p==='withFailureHandler')return f=>runner(ok,f);
 return(...a)=>{post(p,a).then(r=>{try{ok&&ok(r)}catch(err){fail&&fail(err)}},e=>fail&&fail(e))}}})}
window.google={script:{run:runner(null,null)}};
/* ---- Persistência ---- */
let q=Promise.resolve();
function flush(){const p={};if(dirty.cfg)p.cfg=cfg;if(dirty.cx)p.cx=cx;
 if(dirty.snaps.size){p.snaps={};dirty.snaps.forEach(x=>p.snaps[x]=snaps[x])}
 if(dirty.ext.size){p.ext={};dirty.ext.forEach(x=>p.ext[x]=extras[x]||[])}
 dirty.cfg=false;dirty.cx=false;dirty.snaps.clear();dirty.ext.clear();
 if(!Object.keys(p).length)return;
 q=q.then(()=>new Promise(res=>google.script.run.withSuccessHandler(()=>res()).withFailureHandler(e=>{res();
  if(String(e.message).includes('UNAUTHORIZED'))return login('Código inválido.');toast('Erro ao salvar: '+e.message)}).salvar(p)))}
/* ---- Acesso e carga ---- */
function fatal(msg){hideSplash();const a=document.getElementById('app');if(a&&!a.querySelector('.kpis')){a.innerHTML='<div class="box" style="margin-top:18vh"><h4>Algo deu errado</h4><div class="hint" style="word-break:break-word">'+String(msg).replace(/</g,'&lt;')+'</div><button class="pri" onclick="location.reload()">Recarregar</button></div>'}}
window.addEventListener('error',e=>fatal(e.message||'Erro inesperado'));
window.addEventListener('unhandledrejection',e=>fatal((e.reason&&e.reason.message)||'Erro inesperado'));
function login(msg){hideSplash();$('m1').innerHTML='';$('m2').innerHTML='';
 $('app').innerHTML=`<div class="box" style="margin-top:18vh"><h4>Meu Controle Financeiro</h4><label>Código de acesso</label><input id="lg" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
 <div class="hint" style="color:var(--bad)">${msg||''}</div><button class="pri" onclick="doLogin()">Entrar</button></div>`}
function doLogin(){const v=$('lg').value.trim();if(!v)return;try{localStorage.setItem(CK,v)}catch(e){}load()}
function load(){$('app').innerHTML='<div class="hint" style="text-align:center;margin-top:30vh">Carregando…</div>';
 google.script.run.withSuccessHandler(d=>{cfg=Object.assign(defCfg(),d.cfg||{});snaps=d.snaps||{};extras=d.extras||{};cx=d.cx||[];k=openKey();mes(k);flush();render();hideSplash()})
 .withFailureHandler(e=>{if(String(e.message).includes('UNAUTHORIZED')){try{localStorage.removeItem(CK)}catch(x){}return login('Código inválido.')}
  hideSplash();$('app').innerHTML=`<div class="box" style="margin-top:18vh"><h4>Não foi possível carregar</h4><div class="hint">${e.message}</div><button class="pri" onclick="load()">Tentar de novo</button></div>`}).getAll()}
function start(){if(API_URL.indexOf('script.google.com')<0){hideSplash();$('app').innerHTML='<div class="box" style="margin-top:18vh"><h4>Falta configurar</h4><div class="hint">Edite a constante API_URL no index.html com a URL do seu App da Web (termina em /exec).</div></div>';return}
 getCode()?load():login()}
start();
</script></body></html>
